","Рискованные пункты не выбраны по умолчанию при пакетном изменении. Доступ зависит от версии Windows, прав, оборудования и политик. Точный откат сохранён."]},{version:"7.2.0",title:"Настройки Windows без имитации",items:["В каталоге 13 настроек: игровой режим, DVR, шесть эффектов интерфейса и пять параметров питания от сети. Доступные пункты включаются и выключаются через Windows, исходные значения восстанавливаются отдельно.","Подтверждения FramePulse показывают список изменений и риски. Поддержка зависит от ПК, драйверов, прав и политики Windows.","Пресеты и профили используют реальные настройки. Фальшивые баллы и прогнозы FPS убраны; добавлен однопоточный вычислительный тест CPU."]},{version:"7.1.0",title:"Окно FPS, драйверы и про-сцена",items:["FPS Booster: «Включить все» с предупреждениями, выбор без рискованных пунктов, фильтр применяемых настроек Windows и возврат предыдущих отметок.","Драйверы: запрос доступных обновлений Windows по кнопке, официальные ссылки, поиск и экспорт CSV. Возраст драйвера не выдаётся за проверку актуальности.","Про-сцена: 376 составов CS2 и 278 профилей Dota 2 из открытых источников. Поиск, избранное, сравнение и редактор своих настроек. Forza и неподтверждённые конфиги убраны.","В настройках: сетка, перетаскивание, точные координаты, размер, прозрачность и компактный режим игрового счётчика FPS.","В «Диагностике ПК» проще названия и инструкции; прежние инструменты и данные сохранены."]},{version:"7",title:"FramePulse · новый Liquid Glass",items:["FastFPS Classic теперь называется FramePulse. Новый значок используется в приложении, установщике и ярлыках.","Обновлены обзор, навигация и тема Liquid Glass. Все разделы, диагностика и сохранённое оформление доступны как прежде.","Новые короткие звуки, отдельные сигналы успеха и предупреждения, ползунок громкости и прослушивание в настройках.","Удалены старый хост Electron, его зависимости и сценарии сборки. При обновлении сохраняются данные, автозапуск и резервные копии Classic .NET."]},{version:"6.2",title:"Рабочие настройки Windows",items:["Убраны пять заглушек «скоро». Автозапуск регистрируется для текущего пользователя и открывает FastFPS свёрнутым. Десктоп читает реальное состояние, браузерное демо ничего в Windows не меняет.","Авто-определение распознаёт поддерживаемую игру в фокусе; автооптимизация временно повышает обычный приоритет на одну ступень, не трогая конфиги, реестр твиков и энергоплан.","Игровой оверлей использует кадры вывода PresentMon (ETW), не внедряется в игру и показывает «—» без доступных замеров. Рассчитан на оконный и безрамочный режимы.","Безопасный режим проверяется в Windows-хосте: блокирует новые твики, повышение приоритета, завершение процессов и очистку. Сканирование и откат по резервным копиям остаются доступны.","Настройки сгруппированы, добавлены статусы, навигация и подсказки. Исправлены преждевременное подтверждение пресетов, имитация оптимизации на странице игр и сброс интерфейса с неясной областью действия."]},{version:"6.1",title:"40 функций и новые индикаторы",items:["В паспорте дисков — тонкие индикаторы в цветах темы, подписи свободного места и доли занятого. Индикатор записи нагрузки тоже использует Liquid Glass.","В «Инструментах» три новых подраздела с 10 функциями: проверка ресурсов, история места и сравнение процессов; расчёты диска, плотности пикселей, переноса файлов и электричества; журнал, чек-лист и дата обслуживания.","«Бенчмарк»: бюджет кадра, разбор frametime, сравнение прогонов, доля медленных кадров, журнал FPS и таймер. «Игры»: шесть расчётов чувствительности, угла обзора, рендера и размера клипов.","«Мониторинг»: интервал, пауза окна, выбор графиков, порог, статистика и CSV. «Процессы»: поиск по PID, закрепления, фильтр памяти, группировка, категории и CSV.","«Оформление»: свои темы, сравнение без применения, контраст, CSS и отдельный сброс цветов или эффектов. Новые функции не применяют системные твики, данные сохраняются локально."]},{version:"6",title:"Новые темы, диагностика и чёткий шрифт",items:["Исправлено сглаживание текста установщика, мелкие подписи стали крупнее. На рабочем столе ярлык теперь называется «FastFPS Classic».","«Фуксия и золото» применяет цвета #FF0084 и #CDB14C и фон «Бордо» из пользовательского скриншота. Добавлена «Полярная ночь».","Новая группа «Инструменты»: паспорт системы с дисками и питанием; запись CPU, GPU и памяти с графиком; сравнение двух измерений; экспорт CSV/JSON и копирование сводки.","16 быстрых переходов к штатным инструментам Windows. Они только открывают нужный раздел: в фоне системные параметры не меняются.","На странице диагностики в браузере используются явно отмеченные демонстрационные данные. Показатели нагрузки не означают FPS в игре."]},{version:"5.0.0-beta.2",title:"Фирменный установщик Liquid Glass",items:["Вместо белого мастера — цельное тёмное окно FastFPS с логотипом, фирменным фоном и собственными кнопками.","Папка, ярлык, ход установки и запуск — в одном окне. Старый FastFPS, пользовательские данные и резервные копии не удаляются.","Код приложения и интерфейс Classic не менялись, кроме номера версии и этой записи. Системные ограничения beta.1 остаются."]},{version:"5.0.0-beta.1",title:"Classic на .NET · предварительная версия",items:["Оригинальные Liquid Glass, меню, палитра и шрифты сохранены. Новый Windows-хост на C#/.NET и WebView2; Electron не входит в этот установщик.","Кнопка «Убрать все» очищает очередь уведомлений. Одна операция с процессами выдаёт одну сводку; уже завершённые процессы не считаются ошибками.","Карточки железа следуют за FPS, не ожидая правой колонки. Название Windows читается как Unicode; испорченная строка больше не выводится.","CPU, память и список процессов читаются без PowerShell. У очистки есть отмена сканирования и отметка неполных результатов.","Переход на новый хост не изменяет папку старого FastFPS. Не все старые системные твики перенесены: недоступные помечены. Данные WebView2 хранятся отдельно.","Автоматические проверки рендера, логики и целостности пакета не заменяют проверку установки и нагрузки на настоящей Windows. Прирост FPS не заявлен."]},{version:"4.2.1",title:"Classic · восстановлен исходный Liquid Glass",items:["Один LIVE, исправлено обрезание свечения кольца, карточка FPS больше не растягивается до высоты соседней.","Асинхронное сканирование и быстрые уведомления; 20 ручных шагов для измерения и оптимизации FPS."]},{version:"3.1",title:"Исходная версия из архива",items:["Оригинальный обзор, мониторинг, менеджер процессов, профили, пресеты, настройки и выбор темы."]}],jo=Tm[0].version,et={cpu:"AMD Ryzen 5 5500",cpuThreads:12,cpuBaseClock:"3.6 GHz",cpuBoostClock:"4.2 GHz",cpuTdp:"65W",cpuSocket:"AM4",gpu:"AMD Radeon RX 5700 XT",gpuVram:"8 GB GDDR6",gpuBoostClock:"1905 MHz",ram:"32 GB DDR4",ramSpeed:"3200 MHz",ramChannels:"Dual",motherboard:"B550",os:"Windows 11 Pro 23H2"},Br=[{id:"cs2",name:"Counter-Strike 2",genre:"Шутер",icon:"Crosshair",optimized:!0,engine:"Source 2",settings:{graphics:"Низкие",resolution:"1280x960 (4:3)",fpsTarget:300,cpuThreads:6,gpuPower:"Стандартный",vsync:!1,shadows:"Низкие",textures:"Низкие",aa:"Выключено",fov:90},currentFps:245,optimizedFps:312,p1Low:180,p1LowOptimized:240},{id:"valorant",name:"Valorant",genre:"Шутер",icon:"Target",optimized:!0,engine:"Unreal Engine 4",settings:{graphics:"Низкие",resolution:"1920x1080",fpsTarget:360,cpuThreads:6,gpuPower:"Стандартный",vsync:!1,shadows:"Выключены",textures:"Низкие",aa:"Выключено",fov:103},currentFps:310,optimizedFps:378,p1Low:240,p1LowOptimized:310},{id:"cyberpunk",name:"Cyberpunk 2077",genre:"RPG",icon:"Building2",optimized:!1,engine:"REDengine 4",settings:{graphics:"Высокие + FSR",resolution:"1920x1080",fpsTarget:60,cpuThreads:6,gpuPower:"Разгон",vsync:!0,shadows:"Средние",textures:"Высокие",aa:"TAA",fov:80},currentFps:42,optimizedFps:68,p1Low:28,p1LowOptimized:52},{id:"gta5",name:"GTA V",genre:"Open World",icon:"Car",optimized:!0,engine:"RAGE",settings:{graphics:"Высокие",resolution:"1920x1080",fpsTarget:120,cpuThreads:6,gpuPow
